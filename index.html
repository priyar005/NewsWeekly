<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Neighborhood News</title>

    <style>
        body {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
            font-family: Georgia, serif;
            background: #f7f3ea;
            color: #222;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #222;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        header p {
            font-style: italic;
        }

        section {
            margin-top: 40px;
        }

        .latest {
            text-align: center;
            padding: 35px;
            border: 2px solid #222;
            background: white;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            margin-top: 10px;
        }

        .issues {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .issue {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }

        .issue a {
            color: #222;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>The Neighborhood News</h1>
    <p>Our neighborhood's weekly newspaper</p>
</header>


    <section class="latest">
        <h2>Latest Issue</h2>

        <h3>Issue #52</h3>

        <a class="button"
           href="issues/issue-52.pdf">
            Read the Latest Issue
        </a>
    </section>
    

<section>
    <h2>Previous Issues</h2>

    <div class="issues">
        
    </div>
</section>

<footer>
    <p>The Neighborhood News</p>
</footer>

</body>
</html>
